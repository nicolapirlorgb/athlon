<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>ATHLON</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATHLON">
<meta name="theme-color" content="#0B0C0E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Michroma&family=Oxanium:wght@300..700&display=swap">
<style>
/* Layout : habitacle sombre, colonne unique ; instrumentation large et fine, rouge course réservé à l'action et aux aiguilles */
:root{
  --bg:#0B0C0E; --surface:#141619; --raise:#1B1E22; --sunk:#070809; --fg:#F1F1EE; --muted:#868C92; --dim:#5B6167; --line:#24282C; --line2:#33383D;
  --accent:#2E6BFF; --accent-hi:#6E98FF; --accent-fg:#FFFFFF; --accent-soft:#0E1A33;
  --good:#3CC27D; --good-soft:#0F2519; --warn:#E9B444; --warn-soft:#2A2110; --bad:#FF5A5F; --bad-soft:#2C1214;
  --p25:#D6001C; --p20:#2D5BD8; --p15:#E9B444; --p10:#2E9E5B; --p5:#E8E8E4; --p2:#3E4348; --p1:#9AA1A7; --plate-ink:#FFFFFF;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --tab-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-stretch:100%;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;background:radial-gradient(120% 60% at 50% -10%,#1A1D21 0%,var(--bg) 60%) fixed,var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tab-h) + 150px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
input,select,textarea{color-scheme:dark}

/* En-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px}
.brand{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:21px;line-height:1;letter-spacing:.14em;text-transform:uppercase}
.brand small{display:block;font-stretch:100%;font-weight:500;font-size:11.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:9px}
.sync{white-space:nowrap;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;display:flex;align-items:center;gap:7px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--dim);display:inline-block}
.sync.ok i{background:var(--good);box-shadow:0 0 8px var(--good)} .sync.err i{background:var(--bad)}
.livery{display:grid;grid-template-columns:1fr;gap:3px;margin-bottom:6px}
.livery i{display:block;height:2px;background:var(--accent)}
.livery i:last-child{height:1px;background:var(--line2)}

h2.sec{font-family:var(--f-display);font-stretch:125%;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.14em;margin:30px 0 12px;text-wrap:balance}
h2.sec::before{content:"";display:inline-block;vertical-align:middle;width:14px;height:2px;background:var(--accent);margin-right:10px;position:relative;top:-2px}
.label{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.note{border-left:2px solid var(--warn);background:var(--warn-soft);padding:11px 13px;border-radius:0 4px 4px 0;font-size:13.5px;margin-top:16px;color:#E9E2D2}
.note.info{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.note.good{border-color:var(--good);background:var(--good-soft);color:var(--fg)}
.note b{font-weight:700}

/* Puces / segmentés */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);border-radius:3px;padding:9px 14px;font-weight:600;font-size:13px;letter-spacing:.04em;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .nxt{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-hi);margin-left:8px}
.chip[aria-pressed="true"] .nxt{color:var(--accent)}

.forme{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px}
.fl{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:10px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg button{border:1px solid var(--line2);border-radius:3px;padding:8px 0;font-weight:600;background:var(--sunk);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.fl .hint{grid-column:2;font-size:11px;color:var(--dim);display:flex;justify-content:space-between;margin-top:-7px}
.gauge{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.gauge svg{width:150px;height:auto;display:block}
.gauge .tick{stroke:var(--dim);stroke-width:1.5}
.gauge .tick.mj{stroke:var(--fg);stroke-width:2}
.gauge .trk{fill:none;stroke:var(--line2);stroke-width:5}
.gauge .red{fill:none;stroke:var(--accent);stroke-width:5}
.gauge .ndl{stroke:var(--accent-hi);stroke-width:3;stroke-linecap:round}
.gauge .hub{fill:var(--fg)}
.gauge .lbl{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.gauge .val{fill:var(--fg);font-size:22px;font-weight:800;font-family:var(--f-display);font-stretch:125%}
.gauge .lv{font-family:var(--f-display);font-stretch:125%;font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.lv.basse{color:var(--warn)} .lv.normale{color:var(--fg)} .lv.haute{color:var(--good)}
.gauge p{margin:6px 0 0;font-size:13px;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line2);background:var(--sunk);border-radius:4px;padding:10px 11px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--fg);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:4px;padding:12px 16px;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);background:var(--raise)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:active{background:var(--accent-hi)}
.btn.big{width:100%;padding:18px;font-family:var(--f-display);font-stretch:125%;font-size:15px;letter-spacing:.16em}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:#5A2226;background:transparent}
.btn.sm{padding:8px 12px;font-size:11.5px}
.link{color:var(--fg);font-weight:600;font-size:13px;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;text-decoration-thickness:2px}

/* Liste de prévisualisation */
.plan{border-top:1px solid var(--line)}
.plan ul{margin:0;padding:0}
.plan li{list-style:none;display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:13px 0;border-bottom:1px solid var(--line)}
.plan .n{font-weight:600}
.plan .t{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
.plan .g{font-size:12px;color:var(--muted)}
.plan .adj{font-size:11px;letter-spacing:.04em;color:var(--warn);text-align:right}
.plan .adj.up{color:var(--good)}

/* Carte exercice en séance */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:13px;position:relative}
.ex.done{border-color:#1F5A3B}
.ex.done::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:2px;background:var(--good)}
.exh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.exh .nm{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:17px;line-height:1.15;text-transform:uppercase;letter-spacing:.04em}
.exh .gp{font-size:12px;color:var(--muted);margin-top:5px}
.target{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:19px;white-space:nowrap;text-align:right}
.target small{display:block;font-stretch:100%;font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.load{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--line2);border-radius:4px;overflow:hidden;background:var(--sunk)}
.stepper button{width:44px;height:46px;font-size:20px;font-weight:500;color:var(--muted)}
.stepper button:active{background:var(--raise);color:var(--fg)}
.stepper input{width:80px;border:0;background:transparent;text-align:center;font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:19px;padding:0;height:46px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .u{padding-right:10px;color:var(--muted);font-size:12px}
.plates{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.plate{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 4px;border-radius:3px;font-weight:700;font-size:11px;color:var(--plate-ink)}
.plate.k25{background:var(--p25)} .plate.k20{background:var(--p20)} .plate.k15{background:var(--p15);color:#1A1A1A} .plate.k10{background:var(--p10)}
.plate.k5{background:var(--p5);color:#1A1A1A} .plate.k2{background:var(--p2)} .plate.k1{background:var(--p1);color:#1A1A1A}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px 1fr 48px;gap:8px;align-items:center}
.set .i{font-family:var(--f-display);font-stretch:125%;font-weight:700;font-size:14px;color:var(--dim);text-align:center}
.set input{border:1px solid var(--line2);background:var(--sunk);border-radius:4px;padding:10px 12px;font-size:17px;font-weight:600;width:100%;min-width:0}
.set input:focus{border-color:var(--fg);outline:none}
.set .ck{width:48px;height:46px;border-radius:4px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;background:var(--sunk)}
.set.ok input{border-color:#1F5A3B;color:var(--good)}
.set.ok .ck{background:var(--good);border-color:var(--good);color:#06150C}
.set .ck svg{width:20px;height:20px}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.feel button{border:1px solid var(--line2);border-radius:3px;padding:8px 0;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.feel button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.exf{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--dim)}

/* Programme */
.day{border-top:1px solid var(--line2);padding-top:12px}
.dayh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dayh input{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;border:0;background:transparent;padding:4px 0;min-width:0;flex:1;border-bottom:1px dashed transparent}
.dayh input:focus{outline:none;border-bottom-color:var(--accent)}
.pl{list-style:none;margin:6px 0 0;padding:0}
.pl li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pl .n{font-weight:600;text-align:left;min-width:0}
.pl .n small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.pl .ctr{display:flex;gap:2px}
.icn{width:36px;height:36px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icn:hover{background:var(--raise);color:var(--fg)}
.icn svg{width:18px;height:18px}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);border-radius:2px;padding:2px 6px;margin-left:8px;vertical-align:2px}

/* Progrès */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--dim);font-size:10px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--accent-hi);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.14}
.chart .dt{fill:var(--surface);stroke:var(--accent-hi);stroke-width:1.6}
.chart .end{fill:var(--fg)}
.chart .lb{fill:var(--fg);font-size:11px;font-weight:700;font-family:var(--f-body)}
.big{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:38px;line-height:1;letter-spacing:-.01em}
.big small{font-stretch:100%;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.delta{font-size:13px;font-weight:600}
.delta.pos{color:var(--good)} .delta.neg{color:var(--bad)}
.vol{display:flex;flex-direction:column;gap:9px}
.vr{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:12.5px}
.vbar{position:relative;height:10px;background:var(--sunk);border-radius:1px;overflow:hidden}
.vbar .band{position:absolute;top:0;bottom:0;background:var(--good-soft);border-left:1px solid var(--good);border-right:1px solid var(--good)}
.vbar .fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--fg)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td,.tbl th{padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tbl td:last-child,.tbl th:last-child{text-align:right}
.coach{white-space:pre-wrap;font-size:14.5px;line-height:1.6;margin-top:10px}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,12,14,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--accent)}

/* Chrono de repos : compte-tours */
.rest{position:fixed;z-index:21;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding:0 max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.rest-in{pointer-events:auto;max-width:540px;margin:0 auto;background:#121417;border:1px solid var(--line2);color:var(--fg);border-radius:8px;padding:12px 12px 12px 12px;box-shadow:0 16px 40px rgba(0,0,0,.6);display:grid;grid-template-columns:96px 1fr;gap:4px 14px;align-items:center}
.dial{grid-row:span 3;position:relative;width:96px;height:96px}
.dial svg{width:96px;height:96px;display:block}
.dial .trk{fill:none;stroke:var(--line2);stroke-width:5}
.dial .prg{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:butt;transition:stroke-dashoffset .25s linear}
.dial .tk{stroke:var(--dim);stroke-width:1.2}
.dial .tm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:22px}
.rest .lb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rest .nx{font-size:13.5px;font-weight:600;line-height:1.3;min-width:0}
.rest .why{font-size:11.5px;color:var(--warn)}
.rest .acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.rest .acts button{background:var(--raise);border:1px solid var(--line2);border-radius:4px;padding:9px 0;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.rest-in.over{border-color:var(--good)}
.rest-in.over .prg{stroke:var(--good)}
.rest-in.over .lb{color:var(--good)}

/* Photos */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:3/4;max-width:100%;border:1px dashed var(--line2);border-radius:4px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;cursor:pointer;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.slot svg{width:24px;height:24px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .cap{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:2px;padding:2px 6px;font-size:9.5px}
.slot input{position:absolute;opacity:0;width:1px;height:1px}
.slot.busy{border-style:solid;border-color:var(--accent);color:var(--fg)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.ph{aspect-ratio:3/4;max-width:100%;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;text-align:center;padding:8px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cmp figcaption{font-size:13px}
.cmp figcaption b{font-family:var(--f-display);font-stretch:125%;font-size:18px;font-weight:800}
.jr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.thumbs{display:flex;gap:4px}
.thumbs .ph{width:42px;border-radius:2px;padding:0}

/* Feuille modale */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-top:1px solid var(--line2);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:17px;letter-spacing:.12em;text-transform:uppercase;margin:0}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.verdict .b{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:2px;padding:4px 7px;white-space:nowrap}
.b.up{background:var(--good-soft);color:var(--good)} .b.reps{background:#121D33;color:#8FB0FF} .b.hold{background:var(--raise);color:var(--muted)} .b.down{background:var(--bad-soft);color:var(--bad)} .b.neutre{background:var(--warn-soft);color:var(--warn)} .b.skip{background:var(--raise);color:var(--dim)} .b.calib{background:var(--accent-soft);color:var(--accent-hi)}
.opt-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 10px;padding-top:14px;border-top:1px dashed var(--line2)}
.opt-h h3{font-family:var(--f-display);font-stretch:125%;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--muted)}
.opt-h span{font-size:11.5px;color:var(--dim)}
.ex.opt{background:transparent;border-style:dashed}
.calib-note{font-size:12.5px;color:var(--fg);background:var(--accent-soft);border-left:2px solid var(--accent);border-radius:0 3px 3px 0;padding:8px 10px}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .24s cubic-bezier(.2,.8,.2,1)} @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}} .gauge .ndl{transition:transform .5s cubic-bezier(.3,1.4,.5,1)} }
@media (max-width:380px){ .fl{grid-template-columns:88px 1fr} .grid3{grid-template-columns:1fr 1fr} .gauge{grid-template-columns:120px 1fr} .gauge svg{width:120px} }

/* ===== Édition : épuré, serif éditorial pour titres et chiffres, labels larges et espacés ===== */
:root{ --f-serif:"Instrument Serif","Times New Roman",Georgia,serif; }
.top{padding-bottom:18px}
.brand{font-family:var(--f-serif);font-stretch:100%;font-weight:400;font-size:34px;letter-spacing:-.01em;text-transform:none;line-height:1}
.brand em{font-style:italic;color:var(--muted)}
.brand small{font-family:var(--f-body);font-size:10.5px;letter-spacing:.24em;margin-top:10px}
.livery{display:flex;flex-direction:column;gap:0;margin-bottom:4px}
.livery i:first-child{width:44px;height:2px}
.livery i:last-child{height:1px;background:var(--line)}
h2.sec{font-family:var(--f-serif);font-stretch:100%;font-weight:400;font-size:31px;letter-spacing:-.01em;text-transform:none;margin:40px 0 14px;line-height:1.05}
h2.sec::before{display:none}
h2.sec .ey{display:block;font-family:var(--f-body);font-size:10.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.label{letter-spacing:.2em;font-size:10px}
.forme,.panel,.ex{border:0;border-radius:14px;background:var(--surface)}
.forme{padding:20px}
.panel{padding:20px}
.note{border-radius:0 10px 10px 0}
.btn{letter-spacing:.18em;font-size:11.5px;font-weight:600;border-radius:999px;padding:13px 20px}
.btn.sm{padding:9px 14px;font-size:10.5px}
.btn.big{font-family:var(--f-body);font-stretch:100%;font-weight:600;font-size:12px;letter-spacing:.26em;padding:20px;border-radius:999px}
.chip{border-radius:999px;padding:10px 16px;font-size:13px;letter-spacing:.02em}
.seg button{border-radius:999px}
.big,.target,.plan .t,.cmp figcaption b,.stepper input,.dial .tm{font-family:var(--f-serif);font-stretch:100%;font-weight:400;letter-spacing:0}
.big{font-size:52px}
.target{font-size:30px;font-style:italic}
.plan .t{font-size:21px}
.stepper input{font-size:26px;font-style:italic}
.dial .tm{font-size:28px}
.gauge .val{font-family:var(--f-serif);font-stretch:100%;font-weight:400;font-size:30px;font-style:italic}
.gauge .lv{font-family:var(--f-serif);font-stretch:100%;font-weight:400;font-size:26px;letter-spacing:0;text-transform:none}
.exh .nm{font-family:var(--f-serif);font-stretch:100%;font-weight:400;font-size:25px;letter-spacing:0;text-transform:none;line-height:1.05}
.dayh input{font-family:var(--f-serif);font-stretch:100%;font-weight:400;font-size:26px;letter-spacing:0;text-transform:none}
.sheet h3,.opt-h h3{font-family:var(--f-serif);font-stretch:100%;font-weight:400;font-size:26px;letter-spacing:0;text-transform:none}
.opt-h h3{font-size:22px;color:var(--fg)}
.tabs button{letter-spacing:.14em}

/* Visuels de séance */
.hero{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;border-radius:16px;overflow:hidden;background:#111316;margin-top:6px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .cap{position:absolute;left:20px;right:20px;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .cap .k{font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(241,241,238,.7)}
.hero .cap .t{font-family:var(--f-serif);font-size:40px;line-height:.95;color:#F1F1EE;margin-top:6px}
.hero .cap .t em{font-style:italic;color:rgba(241,241,238,.7)}
.hero .cap .m{font-family:var(--f-serif);font-style:italic;font-size:22px;color:#F1F1EE;text-align:right;white-space:nowrap}
.hero .cap .m small{display:block;font-family:var(--f-body);font-style:normal;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(241,241,238,.6)}
.plan li{grid-template-columns:34px 1fr auto;padding:16px 0}
.plan .ix{font-family:var(--f-serif);font-style:italic;font-size:20px;color:var(--dim);grid-row:span 2;line-height:1.2}
.plan .n{font-size:15.5px}

/* Mode séance pas à pas */
.f-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.f-top .lk{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.f-top .lk svg{width:16px;height:16px}
.f-prog{display:flex;gap:4px;margin:14px 0 0}
.f-prog button{flex:1;height:4px;border-radius:2px;background:var(--line2)}
.f-prog button.done{background:var(--fg)}
.f-prog button.cur{background:var(--accent)}
.f-prog button.opt{opacity:.45}
.f-hero{position:relative;padding:34px 0 8px;min-height:150px}
.f-ghost{position:absolute;right:-6px;top:-8px;font-family:var(--f-serif);font-style:italic;font-size:170px;line-height:1;color:var(--surface);pointer-events:none;user-select:none}
.f-hero .label{position:relative}
.f-name{position:relative;font-family:var(--f-serif);font-weight:400;font-size:44px;line-height:.98;letter-spacing:-.01em;margin:10px 0 0;text-wrap:balance}
.f-meta{position:relative;font-size:13px;color:var(--muted);margin-top:12px}
.f-card{background:var(--surface);border-radius:20px;padding:22px 20px;margin-top:18px;display:flex;flex-direction:column;gap:18px}
.f-set{display:flex;justify-content:space-between;align-items:baseline}
.f-set b{font-family:var(--f-serif);font-weight:400;font-style:italic;font-size:22px;color:var(--fg);letter-spacing:0}
.f-rep{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:6px}
.f-rep button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line2);font-size:24px;color:var(--fg)}
.f-rep button:active{background:var(--raise)}
.f-big{text-align:center;font-family:var(--f-serif);font-style:italic;font-size:104px;line-height:.9}
.f-big small{display:block;font-family:var(--f-body);font-style:normal;font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.f-load{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.f-load .stepper{border-radius:999px;border-color:var(--line2)}
.f-load .at{font-family:var(--f-serif);font-style:italic;font-size:22px;color:var(--muted)}
.f-dots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.f-dot{min-width:34px;height:34px;border-radius:999px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--dim);padding:0 8px}
.f-dot.ok{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.f-dot.cur{border-color:var(--accent);color:var(--fg)}
.f-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.f-nav .btn{width:100%}
.f-done{text-align:center;padding:10px 0}
.f-done .t{font-family:var(--f-serif);font-size:34px}
.f-small{display:flex;justify-content:center;gap:18px;margin-top:4px}
#focus-rest:empty{display:none}
.frest{background:var(--surface);border-radius:20px;padding:22px 20px;margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.frest .dial{width:190px;height:190px;grid-row:auto}
.frest .dial svg{width:190px;height:190px}
.frest .dial .tm{font-size:54px;font-style:italic}
.frest .lb{font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.frest .nx{font-size:14px;color:var(--fg);max-width:30ch}
.frest .why{font-size:12px;color:var(--warn)}
.frest .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.frest .acts button{border:1px solid var(--line2);border-radius:999px;padding:11px 0;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.frest.over .prg{stroke:var(--good)} .frest.over .lb{color:var(--good)}

/* ===== En-tête : profil ===== */
.hright{display:flex;align-items:center;gap:12px}
.hprof{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.hprof svg{width:18px;height:18px}
.hprof[aria-current]{color:var(--fg);border-color:var(--fg)}
@media (max-width:430px){ .sync span{display:none} }

/* ===== Nutrition ===== */
.n-day{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.n-day button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);color:var(--fg);display:flex;align-items:center;justify-content:center}
.n-day button:disabled{opacity:.3}
.n-day button svg{width:16px;height:16px}
.n-day .d{text-align:center}
.n-day .d b{display:block;font-family:var(--f-serif);font-weight:400;font-size:26px;line-height:1.1}
.n-sum{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.n-ring{position:relative;width:150px;height:150px}
.n-ring svg{width:150px;height:150px;display:block}
.n-ring .trk{fill:none;stroke:var(--sunk);stroke-width:9}
.n-ring .prg{fill:none;stroke:var(--fg);stroke-width:9;stroke-linecap:round}
.n-ring .prg.over{stroke:var(--warn)}
.n-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.n-ring .c b{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:38px;line-height:1}
.n-ring .c span{font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.mac{display:flex;flex-direction:column;gap:12px;min-width:0}
.mac .r{display:flex;flex-direction:column;gap:5px}
.mac .r .h{display:flex;justify-content:space-between;font-size:12.5px}
.mac .r .h span{color:var(--muted)}
.mac .b{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
.mac .b i{display:block;height:100%;border-radius:3px}
.n-add{display:flex;flex-direction:column;gap:12px}
.n-in{display:grid;grid-template-columns:1fr 46px;gap:8px}
.n-in input{border:1px solid var(--line2);background:var(--sunk);border-radius:999px;padding:12px 16px;font-size:16px;min-width:0;width:100%}
.n-in input:focus{outline:none;border-color:var(--fg)}
.n-cam{position:relative;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.n-cam svg{width:20px;height:20px}
.n-cam input{position:absolute;opacity:0;width:1px;height:1px}
.n-sugg{display:flex;flex-direction:column}
.n-sugg button{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.n-sugg button span{color:var(--muted);font-size:12.5px}
.n-pick{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center;background:var(--raise);border-radius:12px;padding:12px}
.n-pick input{border:1px solid var(--line2);background:var(--sunk);border-radius:8px;padding:9px 10px;font-size:16px;width:100%;min-width:0}
.n-prop{background:var(--raise);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.n-row{display:grid;grid-template-columns:1fr auto 30px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.n-row:last-child{border-bottom:0}
.n-row .nm{min-width:0;font-size:14.5px}
.n-row .nm small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.n-row .k{font-family:var(--f-serif);font-style:italic;font-size:19px;white-space:nowrap}
.n-row .x{width:30px;height:30px;border-radius:50%;color:var(--dim);display:flex;align-items:center;justify-content:center}
.n-row .x svg{width:14px;height:14px}
.n-meal{margin-top:20px}
.n-meal h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 2px;font-family:var(--f-serif);font-weight:400;font-size:22px}
.n-meal h3 span{font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.06em}
.n-rec{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.n-rec::-webkit-scrollbar{display:none}
.n-rec button{flex:none;border:1px solid var(--line2);border-radius:999px;padding:8px 12px;font-size:12.5px;background:var(--surface);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dep{width:100%;border-collapse:collapse;font-size:14px}
.dep td{padding:10px 0;border-bottom:1px solid var(--line)}
.dep td:last-child{text-align:right;font-family:var(--f-serif);font-style:italic;font-size:19px;white-space:nowrap}
.dep tr.tot td{border-bottom:0;padding-top:14px}
.dep tr.tot td:first-child{font-weight:600}
.dep tr.tot td:last-child{font-size:26px}
.dep small{display:block;color:var(--muted);font-size:12px}
.n-goal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.n-goal div{background:var(--raise);border-radius:12px;padding:12px 14px}
.n-goal b{display:block;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:26px;line-height:1.1;margin-top:4px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25}50%{opacity:1}}
.n-busy{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
@media (max-width:380px){ .n-sum{grid-template-columns:1fr;justify-items:center} .mac{width:100%} }

/* ===== Épuré : l'essentiel visible, le reste sur demande ===== */
.more{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:12px 0}
.more svg{width:13px;height:13px;transition:transform .2s}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.more.c{display:flex;margin:0 auto}
.fq{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fq button{border:1px solid var(--line2);border-radius:999px;padding:10px 6px;flex-direction:row;justify-content:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.fq button b{display:none;font-family:var(--f-serif);font-weight:400;font-style:italic;font-size:22px;color:var(--fg);letter-spacing:0}
.fq button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.fq button[aria-pressed="true"] b{color:var(--bg)}
.plan li{grid-template-columns:34px 1fr auto;padding:15px 0;align-items:baseline}
.plan .ix{grid-row:auto}
.cal-tag{color:var(--accent-hi)}
.f-opts{display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:16px;padding:6px 16px;margin-top:4px}
.f-opts button{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
.f-opts button:last-child{border-bottom:0}
.f-opts button span{color:var(--muted);font-size:12.5px}
.f-opts button.dang{color:var(--bad)}
.dep-mini{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dep-mini b{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:34px;line-height:1}
.dep-mini small{display:block;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.brand .wm{display:flex;align-items:center;gap:12px;font-family:var(--f-body);font-stretch:125%;font-weight:700;font-style:normal;font-size:21px;letter-spacing:.26em;line-height:1;color:var(--fg)}
.brand .logo{width:34px;height:34px;flex:none;color:var(--fg)}
.brand small{margin-top:12px}
/* Menus déroulants des séances */
.acc{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;padding:18px 0;border-bottom:1px solid var(--line)}
.acc .t{font-family:var(--f-serif);font-weight:400;font-size:26px;line-height:1.1;letter-spacing:-.01em}
.acc .t em{font-style:italic;color:var(--muted)}
.acc .m{grid-column:1;font-size:12px;color:var(--muted);letter-spacing:.04em}
.acc .ch{grid-row:1/span 2;grid-column:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.acc .ch svg{width:15px;height:15px;transition:transform .2s}
.acc[aria-expanded="true"] .ch svg{transform:rotate(180deg)}
.acc[aria-expanded="true"]{border-bottom-color:transparent}
.acc .pv{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-hi);margin-left:10px;vertical-align:4px;font-family:var(--f-body)}
.acc-body{padding:0 0 18px;border-bottom:1px solid var(--line)}

/* ===== Typo futuriste : Michroma (titres, logo), Oxanium (chiffres) ===== */
:root{ --f-serif:"Oxanium","Archivo",sans-serif; --f-tech:"Michroma","Archivo",sans-serif; }
*{font-style:normal!important}
.brand .wm{font-family:var(--f-tech);font-stretch:100%;font-weight:400;font-size:17px;letter-spacing:.22em}
h2.sec{font-family:var(--f-tech);font-size:17px;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
.f-name{font-family:var(--f-tech);font-size:25px;line-height:1.2;letter-spacing:.01em;text-transform:uppercase}
.acc .t{font-family:var(--f-tech);font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.acc .t em,.hero .cap .t em{color:var(--accent-hi)}
.hero .cap .t{font-family:var(--f-tech);font-size:21px;line-height:1.25;text-transform:uppercase;letter-spacing:.04em}
.n-day .d b,.sheet h3,.opt-h h3,.dayh input,.exh .nm,.n-meal h3{font-family:var(--f-tech);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.gauge .lv{font-family:var(--f-tech);font-size:16px;text-transform:uppercase}
.f-big{font-weight:500;font-size:112px;letter-spacing:-.02em}
.dial .tm,.frest .dial .tm{font-weight:500;letter-spacing:.02em}
.frest .dial .tm{font-size:50px}
.stepper input{font-weight:600;font-size:26px}
.big,.target,.plan .t,.n-ring .c b,.dep td:last-child,.n-goal b,.n-row .k,.dep-mini b,.cmp figcaption b,.f-set b,.f-done .t,.hero .cap .m,.gauge .val{font-weight:600;letter-spacing:.01em}
.plan .t{font-size:18px}
.f-ghost{font-weight:700;color:var(--surface)}
.plan .ix{font-weight:500}
.btn.big{font-family:var(--f-tech);font-size:12px;letter-spacing:.24em}
/* Appli autonome : zones sûres de l'iPhone, pas de rebond ni de zoom */
html{-webkit-text-size-adjust:100%}
body{margin:0;overscroll-behavior-y:none}
.wrap{padding-top:calc(18px + env(safe-area-inset-top,0px))}
button,.chip,.tabs button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{max-width:100%}
[hidden]{display:none!important}

.tabs button{letter-spacing:.04em;font-size:9px}
/* Conversation avec le coach */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 13px;border-radius:12px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;min-width:0}
.msg.u{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.a.err{border-color:#5A2226;color:var(--bad)}
.msg .who{display:block;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-hi);margin-bottom:4px}
.msg .card{margin-top:10px;border-top:1px solid var(--line2);padding-top:8px;white-space:normal}
.msg .card .verdict{padding:8px 0}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25}50%{opacity:1}}
.compose{position:sticky;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 8px);z-index:5;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;background:rgba(11,12,14,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:10px 0 4px;margin-top:14px}
.compose textarea{border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:16px;resize:none;max-height:140px;min-width:0;width:100%}
.compose textarea:focus{outline:none;border-color:var(--fg)}
.compose .send{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.compose .send:disabled{opacity:.4}
.compose .send svg{width:20px;height:20px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid var(--line2);border-radius:999px;padding:8px 12px;font-size:13px;color:var(--fg);background:var(--surface);text-align:left}
.chat-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chat-top select{border:1px solid var(--line2);background:var(--sunk);border-radius:4px;padding:7px 9px;font-size:13px}
@media (prefers-reduced-motion: reduce){ .typing i{animation:none;opacity:.6} }
</style>

<script>
(() => {
"use strict";
/* ---------- utilitaires ---------- */

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const today = () => ymd(new Date());

const dCourt = s => parseD(s).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const APP_VERSION = "1.1.0";
const K_CHAT = "cdf-chat", K_API = "cdf-api";
const K_PHOTOS = "cdf-photos";
const K_ETAT = "cdf-etat", K_SEANCES = "cdf-seances", K_DRAFT = "cdf-brouillon", K_TAB = "cdf-onglet";

const GROUPES = ["Pectoraux","Dos","Trapèzes","Épaules","Biceps","Triceps","Avant-bras","Quadriceps","Ischios","Fessiers","Adducteurs","Mollets","Abdos","Cou"];
const TYPES = { barre: "Barre", halteres: "Haltères", machine: "Machine / poulie", poids_corps: "Poids du corps (+ lest)" };
const PAS = { barre: 2.5, halteres: 2, machine: 2.5, poids_corps: 1.25 };
const arr = (x, type) => { const p = PAS[type] || 2.5; return Math.max(0, Math.round(x / p) * p); };

/* ---------- programme d'exemple ---------- */
function E(nom, groupe, type, charge, repsMin, repsMax, series, inc, repos, opt) {
  const x = { id: uid(), nom, groupe, type, charge, repsMin, repsMax, series, inc, repos, repsCible: repsMin, echecs: 0, calib: true };
  if (opt) x.opt = true;
  return x;
}
/* Programme PPL 5 séances (2 push, 2 pull, 1 jambes) — charges estimées depuis un bench à 125 kg, à calibrer */
function programmeExemple() {
  const m = {}, J = (nom, liste) => { const ids = liste.map(a => { const deja = Object.values(m).find(z => z.nom === a[0]); if (deja) return deja.id; const x = E(...a); m[x.id] = x; return x.id; }); return { id: uid(), nom, exos: ids }; };
  return {
    v: 2,
    profil: { objectif: "muscle", barre: 20 },
    exos: m,
    jours: [
      J("Push A · force", [
        ["Développé couché barre","Pectoraux","barre",102.5,3,5,4,2.5,210],
        ["Développé incliné Smith","Pectoraux","barre",80,6,8,3,2.5,150],
        ["Développé militaire debout barre","Épaules","barre",60,5,8,3,2.5,150],
        ["Dips lestés","Triceps","poids_corps",20,6,10,3,2.5,120],
        ["Extension triceps poulie corde","Triceps","machine",30,10,15,3,2.5,75],
        ["Élévation latérale unilatérale poulie","Épaules","machine",10,12,20,3,1.25,60],
        ["Mollets debout au Smith","Mollets","barre",80,8,12,4,5,75],
        ["Relevés de jambes suspendu","Abdos","poids_corps",0,10,15,3,2.5,60,true],
        ["Cou · extension au harnais","Cou","machine",10,15,20,3,1.25,60,true]
      ]),
      J("Pull A · épaisseur", [
        ["Tractions (échauffement)","Dos","poids_corps",0,8,12,2,2.5,90],
        ["Rowing barre","Dos","barre",90,6,10,4,2.5,150],
        ["Tirage horizontal prise serrée","Dos","machine",75,8,12,3,5,120],
        ["Shrug barre","Trapèzes","barre",120,10,15,3,5,90],
        ["Curl barre EZ","Biceps","barre",40,8,12,3,2.5,90],
        ["Curl marteau haltères","Biceps","halteres",18,10,12,3,2,75],
        ["Crunch à la poulie","Abdos","machine",40,12,15,3,2.5,60,true],
        ["Cou · flexion avec disque (couché)","Cou","machine",5,15,20,3,1.25,60,true]
      ]),
      J("Jambes", [
        ["Hip thrust","Fessiers","barre",140,8,12,4,5,150],
        ["Soulevé de terre roumain","Ischios","barre",110,6,10,3,5,150],
        ["Leg press","Quadriceps","machine",220,10,15,4,10,150],
        ["Leg curl (machine ischios)","Ischios","machine",50,10,15,3,5,90],
        ["Machine à adducteurs","Adducteurs","machine",60,12,15,3,5,75],
        ["Mollets à la presse","Mollets","machine",160,12,20,5,10,60],
        ["Roue abdominale","Abdos","poids_corps",0,8,15,3,2.5,60,true],
        ["Cou · extension au harnais","Cou","machine",10,15,20,3,1.25,60,true]
      ]),
      J("Push B · volume", [
        ["Développé incliné haltères","Pectoraux","halteres",40,8,12,4,2,120],
        ["Chest press","Pectoraux","machine",90,8,12,3,5,120],
        ["Poulie vis-à-vis haut vers bas","Pectoraux","machine",20,12,15,3,2.5,75],
        ["Poulie vis-à-vis bas vers haut","Pectoraux","machine",15,12,15,3,2.5,75],
        ["Élévation latérale unilatérale poulie","Épaules","machine",10,12,20,4,1.25,60],
        ["Barre au front EZ","Triceps","barre",40,8,12,3,2.5,90],
        ["Mollets unilatéral haltère sur marche","Mollets","halteres",24,10,15,3,2,60],
        ["Relevés de jambes suspendu","Abdos","poids_corps",0,10,15,3,2.5,60,true],
        ["Cou · latéral à la serviette","Cou","poids_corps",0,12,15,2,1.25,45,true]
      ]),
      J("Pull B · largeur", [
        ["Tractions lestées","Dos","poids_corps",10,6,10,4,2.5,150],
        ["Tirage vertical prise large","Dos","machine",70,8,12,3,5,120],
        ["Tirage vertical prise neutre serrée","Dos","machine",70,10,12,3,5,90],
        ["Rowing haltère unilatéral","Dos","halteres",40,8,12,3,2,90],
        ["Shrug haltères","Trapèzes","halteres",40,12,15,3,2,75],
        ["Curl incliné haltères","Biceps","halteres",16,8,12,3,2,75],
        ["Curl inversé barre EZ (avant-bras)","Avant-bras","barre",25,12,15,2,2.5,60],
        ["Crunch à la poulie","Abdos","machine",40,12,15,3,2.5,60,true],
        ["Cou · flexion avec disque (couché)","Cou","machine",5,15,20,3,1.25,60,true]
      ])
    ],
    prochain: 0,
    pesees: [{ d: "2026-11-02", kg: 83 }]
  };
}
/* Repos optimisés : 2 min minimum sur les exercices principaux, plus long sur les polyarticulaires lourds */
const REPOS = {
  "Développé couché barre": 240, "Développé incliné Smith": 180, "Développé militaire debout barre": 180, "Dips lestés": 150,
  "Extension triceps poulie corde": 120, "Élévation latérale unilatérale poulie": 120, "Mollets debout au Smith": 120,
  "Tractions (échauffement)": 120, "Rowing barre": 180, "Tirage horizontal prise serrée": 150, "Shrug barre": 120,
  "Curl barre EZ": 120, "Curl marteau haltères": 120,
  "Hip thrust": 180, "Soulevé de terre roumain": 180, "Leg press": 180, "Leg curl (machine ischios)": 120,
  "Machine à adducteurs": 120, "Mollets à la presse": 120,
  "Développé incliné haltères": 180, "Chest press": 150, "Poulie vis-à-vis haut vers bas": 120, "Poulie vis-à-vis bas vers haut": 120,
  "Barre au front EZ": 120, "Mollets unilatéral haltère sur marche": 120,
  "Tractions lestées": 180, "Tirage vertical prise large": 150, "Tirage vertical prise neutre serrée": 120, "Rowing haltère unilatéral": 120,
  "Shrug haltères": 120, "Curl incliné haltères": 120, "Curl inversé barre EZ (avant-bras)": 120
};
function migrer() {
  if ((etat.v || 1) < 2 && !seances.length) {
    const p = etat.pesees || [];
    etat = programmeExemple();
    p.forEach(x => { if (!etat.pesees.some(y => y.d === x.d)) etat.pesees.push(x); });
    saveEtat(true);
  }
  if ((etat.v || 1) < 3) {
    for (const k in etat.exos) { const x = etat.exos[k]; if (REPOS[x.nom]) x.repos = REPOS[x.nom]; else if (!x.opt) x.repos = Math.max(120, x.repos || 120); }
    etat.v = 3; saveEtat(true);
  }
  if ((etat.v || 1) < 4) { etat.profil.objectif = "muscle"; if (etat.nutri) etat.nutri.objectif = "masse"; etat.v = 4; saveEtat(true); }
  if ((etat.v || 1) < 5) {
    /* Bilan physique du 4 nov. : mollets, largeur (épaules, dorsaux), deltoïdes arrière, triceps. Sans exercice à deux poulies. */
    const jour = pre => etat.jours.find(j => j.nom.startsWith(pre));
    const exo = (j, nom) => j && j.exos.map(id => etat.exos[id]).find(x => x && x.nom === nom);
    const ajoute = (j, nom, groupe, type, charge, mn, mx, series) => {
      if (!j || exo(j, nom)) return;
      const x = { id: uid(), nom, groupe, type, charge, repsMin: mn, repsMax: mx, series, inc: PAS[type] || 2.5, repos: 120, repsCible: mn, echecs: 0, calib: true };
      etat.exos[x.id] = x;
      const k = j.exos.findIndex(id => etat.exos[id] && etat.exos[id].opt);
      if (k < 0) j.exos.push(x.id); else j.exos.splice(k, 0, x.id);
    };
    const pushA = jour("Push A"), pullA = jour("Pull A"), pushB = jour("Push B"), pullB = jour("Pull B");
    const lat = exo(pushA, "Élévation latérale unilatérale poulie"); if (lat) lat.series = Math.max(4, lat.series);
    const tv = exo(pullB, "Tirage vertical prise large"); if (tv) tv.series = Math.max(4, tv.series);
    ajoute(pullA, "Oiseau haltères buste penché", "Épaules", "halteres", 10, 12, 20, 3);
    ajoute(pullA, "Mollets assis haltère sur les genoux", "Mollets", "halteres", 24, 12, 20, 3);
    ajoute(pushB, "Extension triceps au-dessus de la tête (poulie)", "Triceps", "machine", 25, 10, 15, 3);
    ajoute(pullB, "Élévations latérales haltères", "Épaules", "halteres", 12, 12, 20, 3);
    ajoute(pullB, "Oiseau haltères sur banc incliné", "Épaules", "halteres", 8, 12, 20, 3);
    etat.v = 5; saveEtat(true);
  }
  if (!etat.nutri) { normaliser(etat); saveEtat(true); }
}
/* Repos du moment : base de l'exercice, ajustée à la série et à la forme */
/* Durée estimée : effort ~30 s (séries lourdes) ou ~45 s, repos complet, 1 min de transition, 10 min d'échauffement */
function dureeExo(x, series) { const work = x.repsMax <= 6 ? 30 : 45; return series * (work + (x.repos || 120)) + 60; }
function dureePlan(j, niveau) {
  let main = 600, opt = 0, r = 0;
  for (const id of j.exos) { const x = etat.exos[id]; if (!x) continue; const p = planExo(x, x.opt ? "normale" : niveau, x.opt ? 0 : r); if (!x.opt) r++; const t = dureeExo(x, p.series); if (x.opt) opt += t; else main += t; }
  return { main: Math.round(main / 60), opt: Math.round(opt / 60) };
}
const fmtMin = m => m >= 60 ? Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") : m + " min";
const DUREE_MAX = 105;
/* Repos série par série : base propre à l'exercice (apprise de ton rythme), puis ajustée à ce que la série vient de te coûter */
function reposIntelligent(x, d, reps, si, xSuiv) {
  const base = x.repos || 120, lourd = x.repsMax <= 6, why = [];
  const fin = !d.series.some(z => !z.fait);
  // transition : le repos se cale sur l'exercice suivant, plus le temps de s'installer
  let sec = fin && xSuiv ? (xSuiv.repos || 120) : base;
  const add = (v, t) => { sec += v; why.push({ d: v, t }); };
  if (fin && xSuiv) {
    if (xSuiv.type === "barre" || xSuiv.type === "machine") add(30, "installation");
  } else {
    const ecart = reps - d.cible;
    if (reps && ecart <= -2) add(45, "série bien sous l'objectif");
    else if (reps && ecart < 0) add(30, "série sous l'objectif");
    else if (reps && ecart >= 2 && !lourd) add(-15, "série large");
    if (lourd && si >= 2) add(15, "fatigue cumulée");
  }
  if (d.ressenti === "dur") add(30, "ressenti dur");
  else if (d.ressenti === "facile" && !fin) add(-15, "ressenti facile");
  if (draft && draft.niveau === "basse" && !x.opt) add(30, "forme basse");
  const plancher = x.opt ? 45 : 120;
  if (sec < plancher) { sec = plancher; why.splice(0, why.length, ...why.filter(w => w.d > 0)); }
  sec = Math.min(360, Math.round(sec / 15) * 15);
  return { sec, why: why.filter(w => w.d) };
}
/* Apprentissage : rapproche la base de l'exercice de tes repos réellement pris (±1 min autour de la référence) */
function reposAppris(x, d) {
  const pris = (d.reposPris || []).filter(v => v >= 45 && v <= 480).sort((a, b) => a - b);
  if (pris.length < 2) return null;
  const med = pris[Math.floor(pris.length / 2)], ref = x.reposRef || REPOS[x.nom] || x.repos;
  let v = Math.round((0.75 * x.repos + 0.25 * med) / 15) * 15;
  v = Math.max(ref - 60, Math.min(ref + 60, v));
  if (!x.opt) v = Math.max(120, v);
  return v !== x.repos ? v : null;
}
const fmtRepos = v => Math.floor(v / 60) + ":" + String(v % 60).padStart(2, "0");
function normaliser(e) {
  if (!e || typeof e !== "object" || !e.exos || !Array.isArray(e.jours)) return programmeExemple();
  e.profil = Object.assign({ objectif: "muscle", barre: 20 }, e.profil || {});
  e.pesees = Array.isArray(e.pesees) ? e.pesees : [];
  e.nutri = Object.assign({ sexe: "homme", taille: 183, age: 22, activite: 1.375, objectif: "masse", prot: 2 }, e.nutri || {});
  e.prochain = Number.isInteger(e.prochain) ? e.prochain : 0;
  for (const k in e.exos) { const x = e.exos[k]; if (x.repsCible == null) x.repsCible = x.repsMin; if (x.echecs == null) x.echecs = 0; }
  e.jours.forEach(j => j.exos = j.exos.filter(id => e.exos[id]));
  return e;
}

/* ---------- état ---------- */
let etat = normaliser(ls.get(K_ETAT));
let seances = Array.isArray(ls.get(K_SEANCES)) ? ls.get(K_SEANCES) : [];
let draft = ls.get(K_DRAFT);
let mode = "local", etatRef = null, syncState = "local";
let photosCol = null, assetsNs = null, photos = [];
const V = {
  tab: ({ progres: "evolution", photos: "evolution", coach: "evolution" })[ls.get(K_TAB)] || ls.get(K_TAB) || "seance",
  jour: null,
  forme: { sommeil: 3, energie: 3, courbatures: 3 },
  poidsJour: "",
  exoGraph: null,
  confirmAbandon: false,
  confirmReset: false,
  coachText: "", coachBusy: false, coachErr: "",
  importMsg: "",
  photoDate: null, vue: "face", photoBusy: null, photoErr: "", confirmDelPhoto: null, cmpA: null, cmpB: null,
  question: "", reponse: "", qBusy: false, adj: null, adjSel: {}
};

/* ---------- stockage (base claude.ai, sinon cet appareil) ---------- */
let chain = Promise.resolve();
function setSync(s) {
  syncState = s;
  const el = $("#sync");
  const txt = { ok: "Synchronisé", local: "Sur ton iPhone", lent: "Connexion lente…", err: "Erreur d'enregistrement" }[s] || s;
  el.className = "sync " + (s === "ok" ? "ok" : s === "err" ? "err" : "");
  el.querySelector("span").textContent = txt;
}
function queue(fn) {
  chain = chain.then(fn).then(() => { if (mode === "db") setSync("ok"); }).catch(() => setSync("err"));
}
let tEtat = null;
function saveEtat(now) {
  ls.set(K_ETAT, etat);
  if (mode !== "db") return;
  clearTimeout(tEtat);
  const go = () => { const b = clone(etat); queue(() => etatRef.set(b)); };
  if (now) go(); else tEtat = setTimeout(go, 700);
}
function saveSeance(s) {
  seances.unshift(s);
  seances.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  ls.set(K_SEANCES, seances.slice(0, 400));
  if (mode === "db") { const b = clone(s); queue(() => etatRef.collection("seances").doc(s.id).set(b)); }
}
function saveDraft() { if (draft) ls.set(K_DRAFT, draft); else ls.del(K_DRAFT); }

/* Photos : fichiers dans IndexedDB, index dans le stockage local */
const idb = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => { const r = indexedDB.open("fonte", 1); r.onupgradeneeded = () => r.result.createObjectStore("blobs"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("blobs", mode); const rq = fn(t.objectStore("blobs")); t.oncomplete = () => res(rq ? rq.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return { put: (k, v) => tx("readwrite", st => st.put(v, k)), get: k => tx("readonly", st => st.get(k)), del: k => tx("readwrite", st => st.delete(k)) };
})();
const urls = new Map();
async function hydrate() {
  for (const im of document.querySelectorAll("img[data-blob]")) {
    if (im.getAttribute("src")) continue;
    const id = im.dataset.blob;
    let u = urls.get(id);
    if (!u) {
      try { const b = await idb.get(id); if (!b) { im.replaceWith(document.createTextNode("Photo indisponible")); continue; } u = URL.createObjectURL(b); urls.set(id, u); }

/* ---------- logique d'entraînement ---------- */
function poidsActuel() {
  const p = etat.pesees.slice().sort((a, b) => a.d < b.d ? 1 : -1)[0];
  return p ? p.kg : null;
}
function forme(f) {
  const score = (f.sommeil + f.energie + (6 - f.courbatures)) / 3;
  const niveau = score < 2.5 ? "basse" : score >= 4.2 ? "haute" : "normale";
  return { score: Math.round(score * 10) / 10, niveau };
}
function planExo(x, niveau, rang) {
  let charge = x.charge, series = x.series, note = "", sens = "";
  if (niveau === "basse") { charge = arr(x.charge * 0.92, x.type); series = Math.max(2, x.series - 1); note = "−8 % · −1 série"; }
  else if (niveau === "haute" && rang < 2) { series = x.series + 1; note = "+1 série"; sens = "up"; }
  return { charge, series, cible: x.repsCible ?? x.repsMin, note, sens };
}
function plaques(total, barre) {
  let side = (total - barre) / 2;
  if (side <= 0) return [];
  const disp = [25, 20, 15, 10, 5, 2.5, 1.25], out = [];
  for (const p of disp) { while (side >= p - 1e-6) { out.push(p); side -= p; } }
  return out;
}
const e1rm = (kg, reps) => reps > 0 ? kg * (1 + reps / 30) : 0;
function chargeEff(x, kg) { return x.type === "poids_corps" ? (poidsActuel() || 75) + kg : kg; }

function evaluer(x, d) {
  const faits = d.series.filter(s => s.fait).map(s => Number(s.reps) || 0);
  if (!faits.length) return { type: "skip", txt: "Non fait : objectif inchangé." };
  const used = Number(d.charge) || 0, minR = Math.min(...faits), complet = faits.length >= d.series.length;
  const cible = x.repsCible ?? x.repsMin;
  const ch = { charge: x.charge, repsCible: cible, echecs: x.echecs || 0 };
  if (x.calib) {
    ch.echecs = 0; ch.calib = false;
    if (complet && minR >= x.repsMax) { ch.charge = arr(used + x.inc, x.type); ch.repsCible = x.repsMin; return { type: "calib", txt: `Base trouvée et déjà au max : prochaine fois ${nf(ch.charge)} kg × ${x.repsMin}.`, ch }; }
    ch.charge = used; ch.repsCible = Math.min(x.repsMax, Math.max(x.repsMin, minR + 1));
    return { type: "calib", txt: `Base enregistrée : ${nf(used)} kg. Prochaine fois, vise ${ch.repsCible} reps.`, ch };
  }
  if (used < x.charge - 0.01) {
    return { type: "neutre", txt: `Charge allégée (${nf(used)} kg) : on garde ${nf(x.charge)} kg × ${cible} pour la prochaine.`, ch };
  }
  const base = used;
  if (complet && minR >= x.repsMax) {
    ch.charge = arr(base + x.inc, x.type); ch.repsCible = x.repsMin; ch.echecs = 0;
    return { type: "up", txt: `Haut de fourchette atteint partout. Prochaine fois : ${nf(ch.charge)} kg × ${x.repsMin}.`, ch };
  }
  if (minR >= x.repsMin && (complet && minR >= cible || used > x.charge + 0.01)) {
    const plus = d.ressenti === "facile" ? 2 : d.ressenti === "dur" ? 0 : 1;
    ch.charge = base; ch.repsCible = Math.min(x.repsMax, Math.max(cible, minR) + plus); ch.echecs = 0;
    if (ch.repsCible === minR) return { type: "hold", txt: `Séries dures : on consolide ${nf(base)} kg × ${minR}.`, ch };
    return { type: "reps", txt: `Objectif validé. Prochaine fois : ${nf(base)} kg, vise ${ch.repsCible} reps.`, ch };
  }
  if (minR < x.repsMin) {
    ch.echecs = (x.echecs || 0) + 1;
    if (ch.echecs >= 2) {
      ch.charge = arr(base * 0.9, x.type); ch.repsCible = x.repsMin; ch.echecs = 0;
      return { type: "down", txt: `2 séances sous ${x.repsMin} reps : décharge à ${nf(ch.charge)} kg pour repartir.`, ch };
    }
    ch.charge = base;
    return { type: "hold", txt: `Sous la fourchette (${minR} reps). On garde ${nf(base)} kg et on retente.`, ch };
  }
  ch.charge = base; ch.echecs = 0;
  return { type: "hold", txt: `Presque. On garde ${nf(base)} kg, vise ${cible} reps sur toutes les séries.`, ch };
}

function visuel(nom, k, meta) {
  const parts = String(nom).split("·");
  const t = esc(parts[0].trim()), sub = parts[1] ? esc(parts[1].trim()) : "";
  return `<div class="hero"><canvas data-art="${esc(nom)}"></canvas><div class="cap"><div><div class="k">${k}</div><div class="t">${t}${sub ? ` <em>${sub}</em>` : ""}</div></div>${meta ? `<div class="m">${meta}</div>` : ""}</div></div>`;

function dessinerVisuels() {
  document.querySelectorAll("canvas[data-art]").forEach(cv => {
    const r = cv.getBoundingClientRect(), W = r.width, H = r.height; if (!W || !H) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const nom = cv.dataset.art || ""; let sd = 7; for (const c of nom) sd = (sd * 31 + c.charCodeAt(0)) >>> 0;
    const rnd = () => { sd = (sd * 1664525 + 1013904223) >>> 0; return sd / 4294967296; };
    const pull = /pull|tir/i.test(nom), legs = /jambe|leg/i.test(nom);
    const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, "#1A1D21"); bg.addColorStop(1, "#08090A"); g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.strokeStyle = "rgba(255,255,255,.035)"; g.lineWidth = 1;
    for (let x = 18; x < W; x += 18) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); }
    const cx = legs ? W * .5 : pull ? W * (.28 + rnd() * .08) : W * (.7 + rnd() * .08), cy = legs ? H * .38 : H * (.42 + rnd() * .08), R = H * (legs ? .48 : .62);
    // disques : anneaux concentriques
    for (let i = 0; i < 18; i++) {
      const rr = R * (1 - i * .048); if (rr <= R * .14) break;
      g.beginPath(); g.arc(cx, cy, rr, 0, Math.PI * 2);
      if (i === 3) { g.strokeStyle = "#2E6BFF"; g.lineWidth = 2.5; } else { g.strokeStyle = `rgba(241,241,238,${i % 4 === 0 ? .2 : .06})`; g.lineWidth = i % 4 === 0 ? 1.4 : 1; }
      g.stroke();
    }
    g.beginPath(); g.arc(cx, cy, R * .14, 0, Math.PI * 2); g.fillStyle = "#0A0B0D"; g.fill(); g.strokeStyle = "rgba(241,241,238,.55)"; g.lineWidth = 1; g.stroke();
    // barre
    const bar = g.createLinearGradient(0, 0, W, 0); bar.addColorStop(0, "rgba(201,204,207,0)"); bar.addColorStop(.5, "rgba(201,204,207,.9)"); bar.addColorStop(1, "rgba(201,204,207,0)");
    g.fillStyle = bar;
    if (legs) g.fillRect(0, cy - 1.5, W, 3); else if (pull) g.fillRect(cx, cy - 1.5, W - cx, 3); else g.fillRect(0, cy - 1.5, cx, 3);
    // trait de vitesse
    g.fillStyle = "#2E6BFF"; g.fillRect(20, H * .2, 36, 2);
    // ombre basse pour le texte
    const sh = g.createLinearGradient(0, H * .45, 0, H); sh.addColorStop(0, "rgba(8,9,10,0)"); sh.addColorStop(1, "rgba(8,9,10,.92)"); g.fillStyle = sh; g.fillRect(0, H * .45, W, H * .55);
  });
}

function jauge(f, msg) {

  let ticks = "";
  for (let v = 1; v <= 5.001; v += 0.5) { const mj = Math.abs(v - Math.round(v)) < .01, [x1, y1] = P(v, r - 9), [x2, y2] = P(v, r - (mj ? 18 : 14)); ticks += `<line class="tick ${mj ? "mj" : ""}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`; if (mj) { const [lx, ly] = P(v, r - 28); ticks += `<text class="lbl" x="${lx.toFixed(1)}" y="${(ly + 3.5).toFixed(1)}" text-anchor="middle">${v}</text>`; } }
  const deg = 150 + (f.score - 1) / 4 * 240;
  return `<div class="gauge"><svg viewBox="0 0 150 122" role="img" aria-label="Forme ${nf(f.score)} sur 5">

    <text class="val" x="${cx}" y="${cy + 38}" text-anchor="middle">${nf(f.score)}</text></svg>

}

function prochainExo(depuis) {
  const n = draft.exos.length, ordre = [];
  for (let k = 1; k <= n; k++) ordre.push((depuis + k) % n);

  const prin = ordre.filter(i => !etat.exos[draft.exos[i].exoId]?.opt);
  return prin.find(libre) ?? ordre.find(libre) ?? -1;
}

function tempsSeance() {
  if (!draft) return "";
  const ecoule = Math.max(0, Math.round((Date.now() - draft.debut) / 60000));
  let reste = 0;
  draft.exos.forEach(z => { const x = etat.exos[z.exoId]; if (!x || x.opt) return; const n = z.series.filter(s => !s.fait).length; if (n) reste += dureeExo(x, n); });
  const fin = ecoule + Math.round(reste / 60);
  return `${fmtMin(ecoule)} · fin ≈ ${fmtMin(fin)}`;
}

    const ns = d.series.findIndex(z => !z.fait);
    let nx;

    lancerRepos(r.sec, nx, r.why, fini ? -1 : ei);

  if (suiv < 0) stopRepos();

  saveDraft();
}

/* ---------- graphiques ---------- */
function courbe(pts, unite) {
  if (pts.length < 2) return `<div class="empty" style="padding:18px 0">${pts.length ? "Encore une séance et la courbe apparaît." : "Pas encore de données."}</div>`;
  const W = 340, H = 160, L = 34, R = 14, T = 16, B = 22;
  const ys = pts.map(p => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = Math.max(1, (hi - lo) * 0.15); lo = Math.floor((lo - pad)); hi = Math.ceil(hi + pad);
  const sx = i => L + i * (W - L - R) / (pts.length - 1);
  const sy = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const ticks = [lo, Math.round((lo + hi) / 2), hi];
  const d = pts.map((p, i) => (i ? "L" : "M") + sx(i).toFixed(1) + " " + sy(p.y).toFixed(1)).join(" ");
  const area = d + ` L${sx(pts.length - 1).toFixed(1)} ${H - B} L${L} ${H - B} Z`;
  const last = pts[pts.length - 1];
  const xl = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].filter((v, i, a) => a.indexOf(v) === i);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe ${unite}">
    ${ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R}" y1="${sy(t)}" y2="${sy(t)}"/><text class="ax" x="${L - 6}" y="${sy(t) + 3}" text-anchor="end">${t}</text>`).join("")}
    <path class="ar" d="${area}"/><path class="ln" d="${d}"/>
    ${pts.length <= 24 ? pts.slice(0, -1).map((p, i) => `<circle class="dt" cx="${sx(i)}" cy="${sy(p.y)}" r="3"/>`).join("") : ""}
    <circle class="end" cx="${sx(pts.length - 1)}" cy="${sy(last.y)}" r="4.5"/>
    <text class="lb" x="${sx(pts.length - 1) - 6}" y="${sy(last.y) - 9}" text-anchor="end">${nf(last.y)}</text>
    ${xl.map(i => `<text class="ax" x="${sx(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}">${dCourt(pts[i].x)}</text>`).join("")}
  </svg>`;
}

function historiqueExo(id) {
  const out = [];
  for (const s of seances.slice().reverse()) {
    const e = (s.exos || []).find(z => z.exoId === id);
    if (!e) continue;
    const reps = (e.reps || []).filter(r => r > 0);
    if (!reps.length) continue;
    const ce = e.type === "poids_corps" ? (s.poids || poidsActuel() || 75) + e.charge : e.charge;
    const best = Math.max(...reps.map(r => e1rm(ce, r)));
    out.push({ x: s.date, y: Math.round(best * 10) / 10, charge: e.charge, reps, type: e.type });
  }
  return out;
}

function vueProgres() {

  // poids

  return `

    <div class="row" style="justify-content:space-between;margin:14px 0 4px;align-items:flex-end"><div class="big num">${h.length ? nf(h[h.length - 1].y) : "—"}<small>kg 1RM estimé</small></div>${deltaHtml}</div>

async function compresser(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (e) { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, s = Math.min(1, 1400 / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("conversion")), "image/jpeg", 0.85));
}
function savePhoto(e) { const b = clone(e); queue(() => photosCol.doc(e.d).set(b)); }
async function ajouterPhoto(vue, file) {
  if (!assetsNs || !file) return;
  V.photoBusy = vue; V.photoErr = ""; render();
  try {
    const blob = await compresser(file);
    const r = await assetsNs.upload(blob, { type: "image/jpeg" });
    const d = V.photoDate || today();
    let e = photos.find(p => p.d === d);
    if (!e) { e = { d, imgs: {} }; const pe = etat.pesees.find(p => p.d === d); if (pe) e.kg = pe.kg; photos.push(e); }
    const old = e.imgs[vue];
    e.imgs[vue] = r.id; savePhoto(e);
    if (old) assetsNs.delete(old).catch(() => {});
    V.vue = vue;
  } catch (err) {
    const m = { too_large: "Photo trop lourde, essaie-en une autre.", unsupported_type: "Format non reconnu : prends la photo en JPEG.", quota_or_state: "Espace de stockage plein : supprime d'anciennes photos.", rate_limited: "Trop d'envois d'un coup, réessaie dans un instant.", upstream_auth: "Reconnecte-toi à claude.ai puis recharge." };
    V.photoErr = err && m[err.code] ? m[err.code] : "L'envoi a échoué. Réessaie.";
  }
  V.photoBusy = null; render();
}
async function supprimerJourPhoto(d) {
  const e = photos.find(p => p.d === d); if (!e) return;

function extraireJSON(txt) {
  try { return JSON.parse(txt); } catch (e) {}
  const f = txt.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const i = txt.indexOf("{"), j = txt.lastIndexOf("}");
  if (i >= 0 && j > i) { try { return JSON.parse(txt.slice(i, j + 1)); } catch (e) {} }
  return null;
}

    .map(a => ({ ajout: true, jour: String(a.jour), nom: String(a.nom).slice(0, 60), groupe: GROUPES.includes(a.groupe) ? a.groupe : "Abdos", type: TYPES[a.type] ? a.type : "machine",

function appliquerAjustements() {

  if (ds.phdel) { V.confirmDelPhoto = ds.phdel; render(); return; }
  if (ds.act === "delphoto-no") { V.confirmDelPhoto = null; render(); return; }
  if (ds.act === "delphoto-ok") { const d = V.confirmDelPhoto; V.confirmDelPhoto = null; supprimerJourPhoto(d).then(render); return; }
  if (ds.delpesee) { etat.pesees = etat.pesees.filter(p => p.d !== ds.delpesee); saveEtat(); render(); return; }

  switch (ds.act) {
    case "start": demarrer(); break;
    case "finish": ouvrirBilan(); break;
    case "save": enregistrer(); break;
    case "abandon": V.confirmAbandon = true; render(); break;
    case "abandon-no": V.confirmAbandon = false; render(); break;
    case "abandon-ok": draft = null; saveDraft(); V.confirmAbandon = false; libererEcran(); stopRepos(); render(); break;
    case "addjour": etat.jours.push({ id: uid(), nom: "Jour " + (etat.jours.length + 1), exos: [] }); saveEtat(); render(); break;
    case "jdel-no": V.confirmDelJour = null; render(); break;
    case "jdel-ok": {
      const j = etat.jours.splice(V.confirmDelJour, 1)[0];
      if (j) j.exos.forEach(id => { if (!etat.jours.some(z => z.exos.includes(id))) delete etat.exos[id]; });
      if (etat.prochain >= etat.jours.length) etat.prochain = 0;
      V.confirmDelJour = null; V.jour = null; saveEtat(); render(); break;
    }
    case "reset": V.confirmReset = true; render(); break;
    case "reset-no": V.confirmReset = false; render(); break;
    case "reset-ok": { const p = etat.pesees, pr = etat.profil; etat = programmeExemple(); etat.pesees = p; etat.profil = pr; V.confirmReset = false; V.jour = null; saveEtat(true); render(); break; }
    case "export": {
      const txt = JSON.stringify({ etat, seances: seances.slice(0, 60) });
      const ok = () => { V.importMsg = "Copié."; render(); };
      try { navigator.clipboard.writeText(txt).then(ok, () => { const a = $("#importTxt"); a.value = txt; a.select(); V.importMsg = ""; }); }
      catch (e) { const a = $("#importTxt"); a.value = txt; a.select(); }
      break;
    }
    case "import": {
      const raw = $("#importTxt").value.trim();
      try {
        const o = JSON.parse(raw);
        const e = normaliser(o.etat || o);
        if (!Object.keys(e.exos).length) throw 0;
        etat = e; saveEtat(true);
        if (Array.isArray(o.seances)) { const ids = new Set(seances.map(s => s.id)); o.seances.filter(s => s && s.id && !ids.has(s.id)).forEach(s => saveSeance(s)); }
        V.importMsg = "Importé."; V.jour = null;
      } catch (err) { V.importMsg = "Format non reconnu : colle le JSON complet."; }
      render(); break;
    }
    case "coach-copy": copierPourCoach(); break;
    case "coach-read": lireReponseCoach(); break;
    case "adj-ok": appliquerAjustements(); break;
    case "adj-no": V.adj = null; V.adjSel = {}; render(); break;
  }
});

document.addEventListener("input", ev => {
  const t = ev.target, ds = t.dataset;
  if (draft && ds.reps) { const [ei, si] = ds.reps.split("-").map(Number); draft.exos[ei].series[si].reps = t.value.replace(/[^0-9]/g, ""); saveDraft(); return; }
  if (t.id === "poidsJour") { V.poidsJour = t.value; return; }
  if (t.id === "coachIn") { V.coachIn = t.value; return; }
  if (ds.adj) { V.adjSel[+ds.adj] = t.checked; return; }
  if (ds.jnom) { etat.jours[+ds.jnom].nom = t.value || "Sans nom"; saveEtat(); return; }
});
document.addEventListener("change", ev => {
  const t = ev.target, ds = t.dataset;
  if (draft && ds.charge) { const d = draft.exos[+ds.charge]; const v = parseFloat(t.value.replace(",", ".")); d.charge = isNaN(v) ? d.charge : Math.max(0, v); saveDraft(); render(); return; }
  if (ds.graph !== undefined) { V.exoGraph = t.value; render(); return; }
  if (ds.photo) { const f = t.files && t.files[0]; t.value = ""; ajouterPhoto(ds.photo, f); return; }
  if (t.id === "phd") { V.photoDate = t.value || today(); render(); return; }
  if (ds.cmp) { V["cmp" + ds.cmp] = t.value; render(); return; }
  if (ds.prof === "objectif") { etat.profil.objectif = t.value; saveEtat(); return; }
  if (ds.prof === "barre") { const v = parseFloat(t.value.replace(",", ".")); if (v >= 0) { etat.profil.barre = v; saveEtat(); } return; }
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target, kind = f.dataset.form;
  const num = (id, def) => { const v = parseFloat(String($(id).value).replace(",", ".")); return isNaN(v) ? def : v; };
  if (kind === "exo") {
    const isNew = f.dataset.new === "true", id = f.dataset.id, ji = +f.dataset.j;
    const nom = $("#f-nom").value.trim(); if (!nom) { $("#f-nom").focus(); return; }
    const old = etat.exos[id] || {};
    let mn = Math.max(1, Math.round(num("#f-min", 8))), mx = Math.max(mn, Math.round(num("#f-max", 12)));
    const x = Object.assign({}, old, {
      id, nom, groupe: $("#f-groupe").value, type: $("#f-type").value,
      charge: Math.max(0, num("#f-charge", 0)), repsMin: mn, repsMax: mx,
      series: Math.max(1, Math.round(num("#f-series", 3))), inc: Math.max(0.5, num("#f-inc", 2.5)),
      repos: Math.max(15, Math.round(num("#f-repos", 120))),
      repsCible: Math.min(mx, Math.max(mn, Math.round(num("#f-cible", mn)))), echecs: old.echecs || 0
    });
    if (Math.abs(x.charge - (old.charge ?? -1)) > 0.01) delete x.calib;
    if ($("#f-opt").checked) x.opt = true; else delete x.opt;
    etat.exos[id] = x;
    if (isNew && etat.jours[ji]) etat.jours[ji].exos.push(id);
    saveEtat(); fermerSheet(); render(); return;
  }
  if (kind === "photo-kg") {
    const kg = num("#phkg", NaN); if (!(kg > 20 && kg < 300)) return;
    const d = V.photoDate || today();
    etat.pesees = etat.pesees.filter(p => p.d !== d); etat.pesees.push({ d, kg }); saveEtat();
    const e = photos.find(p => p.d === d); if (e) { e.kg = kg; savePhoto(e); }
    render(); return;
  }
  if (kind === "pesee" || kind === "pesee-full") {
    const kg = num(kind === "pesee" ? "#pesee-rapide" : "#pk", NaN);
    if (!(kg > 20 && kg < 300)) return;
    const d = kind === "pesee" ? today() : ($("#pd").value || today());
    etat.pesees = etat.pesees.filter(p => p.d !== d); etat.pesees.push({ d, kg });
    saveEtat(); render(); return;
  }
});

migrer();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(dessinerVisuels);
window.addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(dessinerVisuels, 150); });
if (draft) garderEcran();
connecter();
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
</body>
</html>
